version: "3.9"
   
services:
  redis:
    image: arm32v7/redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_MASTER_HOST=${REDIS_MASTER_HOST:-}
      - REDIS_MASTER_PORT=${REDIS_MASTER_PORT:-}
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --tcp-backlog 128 --replicaof ${REDIS_MASTER_HOST} ${REDIS_MASTER_PORT}
    restart: always

  server:
    image: einkaufsliste-multiuser/webapp
    environment:
      - DEPLOY_ENVIRONMENT=production
    build: .
    volumes:
      - ./app:/app
    ports:
      - "8083:80"
    restart: always
    depends_on:
      - redis

  nginx:
    build: ./nginx
    ports:
      - "1337:80"
    depends_on:
      - server
    restart: always


